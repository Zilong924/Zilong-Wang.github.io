role: PhD Student
group: Communication Systems
department: Department of Electrical Engineering (ISY)
university: Linköping University
location: Linköping, Sweden
intro: >-
  I study how learning and communication can work together across a network.
  My research focuses on communication-efficient decentralized learning,
  particularly decentralized learning optimization methods driven by walks on graphs.
about: >-
  I am a PhD student in the Communication Systems division at Linköping
  University, supervised by Prof. Erik G. Larsson and Dr. Karl-Ludwig Besser.
  Before joining LiU, I received my master's degree from Southeast University
  and my bachelor's degree from Nanjing University of Posts and Telecommunications.
previous: >-
  My earlier work focused on anti-jamming transmission and hybrid beamforming
  for cell-free millimeter-wave MIMO systems.
supervisors:
  - name: Erik G. Larsson
  - name: Karl-Ludwig Besser
research:
  - number: "01"
    title: Walk-based decentralized learning
    description: >-
      Learning algorithms in which a model travels between neighboring nodes,
      combining local updates with network-wide optimization.
    tags: [Random walks, Incremental optimization]
  - number: "02"
    title: Communication-aware optimization
    description: >-
      Understanding how link reliability and communication cost shape learning,
      and designing network transitions with these constraints in mind.
    tags: [Reliable communication, Resource efficiency]
  - number: "03"
    title: Wireless systems & learning
    description: >-
      Optimization and learning methods for coordinated wireless transmission,
      with a background in cell-free MIMO and anti-jamming beamforming.
    tags: [Cell-free MIMO, Deep unfolding]
